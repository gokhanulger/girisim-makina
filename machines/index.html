    <style>
        .machines-hero {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 120px 0 60px;
            position: relative;
            overflow: hidden;
        }
        .machines-hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('../images/fabrika-ici-1.jpeg') center/cover no-repeat;
            opacity: 0.2;
        }
        .machines-hero .container { position: relative; z-index: 1; }
        .machines-hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .machines-hero h1 span { color: #e63946; }
        .machines-hero p {
            font-size: 1.1rem;
            opacity: 0.85;
            max-width: 600px;
            line-height: 1.7;
        }

        /* Category section with icon strip */
        .machines-categories-strip {
            background: #f8f9fa;
            padding: 40px 0;
            border-bottom: 1px solid #eee;
        }
        .cat-strip-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .cat-strip-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 16px 24px;
            background: white;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s;
            min-width: 140px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .cat-strip-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            color: var(--primary-color, #e63946);
        }
        .cat-strip-item img {
            width: 64px;
            height: 52px;
            object-fit: contain;
        }
        .cat-strip-item i {
            font-size: 28px;
            color: var(--primary-color, #e63946);
        }

        /* All products section */
        .machines-all-section {
            padding: 60px 0 80px;
        }
        .machines-all-section h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1a1a2e;
        }
        .machines-all-section h2 span { color: var(--primary-color, #e63946); }
        .machines-section-header {
            margin-bottom: 30px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f0f0;
        }
        .machines-section-header p {
            color: #888;
            font-size: 14px;
        }
        .machines-cat-block {
            margin-bottom: 50px;
        }
        .machines-cat-block:last-child {
            margin-bottom: 0;
        }

        @media (max-width: 768px) {
            .machines-hero h1 { font-size: 1.8rem; }
            .machines-hero { padding: 100px 0 40px; }
            .cat-strip-item { min-width: 100px; padding: 12px 16px; font-size: 11px; }
            .cat-strip-item img { width: 48px; height: 40px; }
        }

    <div id="header-placeholder" style="min-height:80px"></div>

    <!-- Hero -->
    <section class="machines-hero">
        <div class="container">
            <h1 data-translate="nav.machines">Makinelerimiz</h1>
            <p data-translate="machines.heroDesc">Gıda işleme ve paketleme sektöründe komple üretim hatları ve tekli makine çözümleri sunuyoruz.</p>
        </div>
    </section>

    <!-- Category Strip (quick navigation) -->
    <section class="machines-categories-strip">
        <div class="container">
            <div class="cat-strip-grid" id="machinesCatStrip">
                <!-- Filled dynamically from Supabase machineCategories -->
            </div>
        </div>
    </section>

    <!-- All Categories & Products -->
    <section class="machines-all-section">
        <div class="container" id="machinesAllContent">
            <!-- Filled dynamically - each category block with its children -->
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script defer src="../js/min/main.min.js?v=20260310a"></script>
    <script defer src="../js/min/translations.min.js?v=20260310a"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="../js/min/supabase-init.min.js?v=20260310a"></script>
    <script defer src="../js/min/site-loader.min.js?v=20260310a"></script>
    <script defer src="../js/min/seo-loader.min.js?v=20260310a"></script>
    <script defer src="../js/min/header-include.min.js?v=20260310a"></script>

    <script>
    // Load all machine categories from Supabase
    (function() {
        var attempts = 0;
        var interval = setInterval(function() {
            attempts++;
            if (window.__siteContent || attempts > 50) {
                clearInterval(interval);
                renderMachinesPage();
                if (typeof window._hidePageLoader === 'function') window._hidePageLoader();
            }
        }, 100);

        function renderMachinesPage() {
            var content = window.__siteContent;
            if (!content || !content.machineCategories || !content.machineCategories.length) return;

            var cats = content.machineCategories;
            var bp = '../';

            // 1. Category strip (top icons)
            var strip = document.getElementById('machinesCatStrip');
            if (strip) {
                strip.innerHTML = cats.map(function(cat) {
                    var href = cat.href ? bp + cat.href : '#' + cat.id;
                    var iconSrc = cat.icon || cat.image || '';
                    var iconHTML = iconSrc
                        ? '<img src="' + iconSrc + '" alt="' + cat.title + '">'
                        : '<i class="fas fa-cogs"></i>';
                    var trAttr = cat.titleKey ? ' data-translate="' + cat.titleKey + '"' : '';
                    return '<a href="' + href + '" class="cat-strip-item">' + iconHTML +
                        '<span' + trAttr + '>' + cat.title + '</span></a>';
                }).join('');
            }

            // 2. All categories with children
            var allContent = document.getElementById('machinesAllContent');
            if (!allContent) return;

            allContent.innerHTML = cats.map(function(cat) {
                var trAttr = cat.titleKey ? ' data-translate="' + cat.titleKey + '"' : '';
                var catHref = cat.href ? bp + cat.href : '#';

                // Collect all leaf products (recursive flatten)
                var items = [];
                function collectItems(children) {
                    if (!children) return;
                    children.forEach(function(child) {
                        if (child.type === 'product' || !child.children || !child.children.length) {
                            items.push(child);
                        } else {
                            // Category with children - show the category card too, then its children
                            items.push(child);
                        }
                    });
                }
                if (cat.children && cat.children.length) collectItems(cat.children);

                if (!items.length) return '';

                var cardsHTML = items.map(function(item) {
                    var imgSrc = item.image || bp + 'images/pexels-factory-machinery.jpg';
                    var itemHref = item.href ? bp + item.href : '#';
                    var isCategory = item.type === 'category' && item.children && item.children.length > 0;
                    var itemTrAttr = item.titleKey ? ' data-translate="' + item.titleKey + '"' : '';
                    var childCount = isCategory ? ' (' + item.children.length + ' ürün)' : '';

                    return '<a href="' + itemHref + '" class="machine-cat-card' + (isCategory ? ' machine-cat-card--category' : '') + '">' +
                        '<div class="machine-cat-img">' +
                            (isCategory ? '<span class="machine-cat-type-badge"><i class="fas fa-folder-open"></i></span>' : '') +
                            '<img src="' + imgSrc + '" alt="' + item.title + '" loading="lazy">' +
                        '</div>' +
                        '<div class="machine-cat-info">' +
                            '<h3' + itemTrAttr + '>' + item.title + childCount + '</h3>' +
                            '<span class="machine-cat-btn">' +
                                (isCategory ? 'Detaylar' : 'Detaylar') +
                                ' <i class="fas fa-arrow-right"></i>' +
                            '</span>' +
                        '</div>' +
                    '</a>';
                }).join('');

                return '<div class="machines-cat-block" id="' + cat.id + '">' +
                    '<div class="machines-section-header">' +
                        '<h2><a href="' + catHref + '" style="text-decoration:none;color:inherit"' + trAttr + '>' + cat.title + ' <span><i class="fas fa-arrow-right" style="font-size:0.6em"></i></span></a></h2>' +
                    '</div>' +
                    '<div class="machine-cat-grid">' + cardsHTML + '</div>' +
                '</div>';
            }).join('');

            // Re-apply translations
            if (typeof applyTranslations === 'function') {
                setTimeout(applyTranslations, 100);
            }
        }
    })();
    </script>
</body>
