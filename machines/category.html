    <script>
    // Generic category page - loads content based on ?id= parameter
    (function() {
        var params = new URLSearchParams(window.location.search);
        var categoryId = params.get('id');
        if (!categoryId) return;

        function findNodeById(nodes, targetId) {
            for (var i = 0; i < nodes.length; i++) {
                if (nodes[i].id === targetId) return nodes[i];
                if (nodes[i].children && nodes[i].children.length) {
                    var found = findNodeById(nodes[i].children, targetId);
                    if (found) return found;
                }
            }
            return null;
        }

        var attempts = 0;
        var interval = setInterval(function() {
            attempts++;
            if (window.__siteContent || attempts > 50) {
                clearInterval(interval);
                loadCategory();
                if (typeof window._hidePageLoader === 'function') window._hidePageLoader();
            }
        }, 100);

        function loadCategory() {
            var content = window.__siteContent;
            if (!content || !content.machineCategories) return;

            var node = findNodeById(content.machineCategories, categoryId);
            if (!node) return;

            // Update page title
            document.title = node.title + ' | Girişim Makina';
            var titleEl = document.getElementById('categoryTitle');
            if (titleEl) titleEl.textContent = node.title;

            // Update meta
            var metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) metaDesc.content = node.title + ' - Girişim Makina';

            if (!node.children || !node.children.length) return;

            var bp = '../';
            var grid = document.getElementById('categoryGrid');
            if (!grid) return;

            grid.innerHTML = node.children.map(function(child) {
                var imgSrc = child.image || bp + 'images/pexels-factory-machinery.jpg';
                var childHref = child.href ? bp + child.href : '#';
                var isCategory = child.type === 'category' && child.children && child.children.length > 0;
                var trAttr = child.titleKey ? ' data-translate="' + child.titleKey + '"' : '';

                return '<a href="' + childHref + '" class="machine-cat-card' + (isCategory ? ' machine-cat-card--category' : '') + '">' +
                    '<div class="machine-cat-img">' +
                        (isCategory ? '<span class="machine-cat-type-badge"><i class="fas fa-folder-open"></i></span>' : '') +
                        '<img src="' + imgSrc + '" alt="' + child.title + '" loading="lazy">' +
                    '</div>' +
                    '<div class="machine-cat-info">' +
                        '<h3' + trAttr + '>' + child.title + '</h3>' +
                        '<span class="machine-cat-btn">' +
                            (isCategory ? 'Alt Kategoriler' : 'Detaylar') +
                            ' <i class="fas fa-arrow-right"></i>' +
                        '</span>' +
                    '</div>' +
                '</a>';
            }).join('');

            if (typeof applyTranslations === 'function') {
                setTimeout(applyTranslations, 100);
            }
        }
    })();
    </script>
