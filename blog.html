    <style>
        .blog-section {
            padding: 80px 0;
        }
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }
        .blog-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: all 0.3s;
        }
        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }
        .blog-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .blog-card .card-content {
            padding: 30px;
        }
        .blog-card .card-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #888;
        }
        .blog-card .card-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .blog-card h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--dark-color);
            line-height: 1.4;
        }
        .blog-card p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 20px;
        }
        .blog-card .read-more {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .blog-card .read-more:hover {
            gap: 12px;
        }
        .blog-card .blog-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }
        .blog-card .blog-tag {
            background: var(--light-bg);
            color: var(--text-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .blog-categories {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 50px;
        }
        .blog-categories button {
            padding: 10px 25px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        .blog-categories button:hover,
        .blog-categories button.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #f8f9fa;
            border-radius: 16px;
        }
        .empty-state i {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--dark-color);
        }
        .empty-state p {
            color: #666;
            max-width: 500px;
            margin: 0 auto;
        }
        .blog-detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            overflow-y: auto;
            padding: 40px 20px;
        }
        .blog-detail-modal.active {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .blog-detail-content {
            background: white;
            max-width: 900px;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }
        .blog-detail-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.5);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
        }
        .blog-detail-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }
        .blog-detail-body {
            padding: 40px;
        }
        .blog-detail-body h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: var(--dark-color);
        }
        .blog-detail-body .meta {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            color: #888;
            font-size: 0.9rem;
        }
        .blog-detail-body .content {
            font-size: 1.1rem;
            line-height: 1.9;
            color: #444;
        }
        .blog-detail-body .content p {
            margin-bottom: 20px;
        }
        .blog-detail-body .content h1,
        .blog-detail-body .content h2,
        .blog-detail-body .content h3 {
            margin-top: 30px;
            margin-bottom: 15px;
            color: var(--dark-color);
        }
        .blog-detail-body .content h2 { font-size: 1.5rem; }
        .blog-detail-body .content h3 { font-size: 1.3rem; }
        .blog-detail-body .content ul,
        .blog-detail-body .content ol {
            margin: 15px 0;
            padding-left: 30px;
        }
        .blog-detail-body .content li { margin-bottom: 8px; }
        .blog-detail-body .content blockquote {
            border-left: 4px solid var(--primary-color);
            margin: 20px 0;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 0 8px 8px 0;
        }
        .blog-detail-body .content a {
            color: var(--primary-color);
            text-decoration: underline;
        }
        .blog-detail-body .content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 15px 0;
        }
        /* Loading skeleton */
        .skeleton-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        .skeleton-img {
            width: 100%;
            height: 220px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .skeleton-text {
            padding: 30px;
        }
        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 7px;
            margin-bottom: 12px;
        }
        .skeleton-line.short { width: 60%; }
        .skeleton-line.medium { width: 80%; }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>

    <script>
        // Store loaded posts globally for detail view and language switch
        window._blogPosts = [];
        window._blogContent = null;

        // === CACHE-FIRST BLOG LOADING ===
        // 1) Show cached posts INSTANTLY (no network wait)
        // 2) Fetch fresh data in background & update if changed

        // Try to show cached content immediately (before DOMContentLoaded)
        (function instantBlogLoad() {
            var posts = extractPostsFromCache();
            if (posts && posts.length > 0) {
                window._blogPosts = posts;
                // Render as soon as DOM is ready
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', function() {
                        renderBlogCards(posts);
                        initCategoryFilter();
                        if (window._hidePageLoader) window._hidePageLoader();
                    });
                } else {
                    renderBlogCards(posts);
                    initCategoryFilter();
                    if (window._hidePageLoader) window._hidePageLoader();
                }
                // Still fetch fresh in background
                backgroundRefresh();
            } else {
                // No cache - must wait for network
                document.addEventListener('DOMContentLoaded', function() {
                    loadBlogPostsFresh();
                    initCategoryFilter();
                });
            }

            // Re-render on language change
            document.addEventListener('languageChanged', function() {
                if (window._blogPosts.length > 0) {
                    renderBlogCards(window._blogPosts);
                }
            });
        })();

        function extractPostsFromCache() {
            // Try sessionStorage first (fastest, most recent)
            try {
                var cached = sessionStorage.getItem('girisim_site_cache');
                if (cached) {
                    var obj = JSON.parse(cached);
                    if (obj.data && obj.data.blog && obj.data.blog.posts && obj.data.blog.posts.length > 0) {
                        return obj.data.blog.posts.filter(function(p) { return p.published; });
                    }
                }
            } catch (e) { /* ignore */ }

            // Try localStorage
            try {
                var local = localStorage.getItem('girisim_site_content');
                if (local) {
                    var content = JSON.parse(local);
                    if (content.blog && content.blog.posts && content.blog.posts.length > 0) {
                        return content.blog.posts.filter(function(p) { return p.published; });
                    }
                }
            } catch (e) { /* ignore */ }

            return null;
        }

        function backgroundRefresh() {
            // Fetch fresh data from Supabase REST API directly (no SDK dependency)
            var sbUrl = 'https://yvptjiowxqllxfzlkosy.supabase.co';
            var sbKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl2cHRqaW93eHFsbHhmemxrb3N5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk0NTQxMTksImV4cCI6MjA4NTAzMDExOX0.9soLQNOJZEpQx__vhJEQzB9SBImPi-ccceB-23WNWAQ';

            fetch(sbUrl + '/rest/v1/site_content?select=content&id=eq.main', {
                headers: { 'apikey': sbKey, 'Authorization': 'Bearer ' + sbKey }
            }).then(function(res) { return res.json(); }).then(function(rows) {
                if (rows[0] && rows[0].content && rows[0].content.blog && rows[0].content.blog.posts) {
                    var freshPosts = rows[0].content.blog.posts.filter(function(p) { return p.published; });
                    if (freshPosts.length > 0 && JSON.stringify(freshPosts) !== JSON.stringify(window._blogPosts)) {
                        window._blogPosts = freshPosts;
                        renderBlogCards(freshPosts);
                    }
                    // Update session cache
                    try {
                        sessionStorage.setItem('girisim_site_cache', JSON.stringify({
                            data: rows[0].content, timestamp: Date.now()
                        }));
                    } catch (e) { /* ignore */ }
                }
            }).catch(function() { /* silently fail - we already have cached data */ });
        }

        async function loadBlogPostsFresh() {
            var blogGrid = document.getElementById('blogGrid');
            var posts = [];

            // Direct REST API fetch (fastest - no SDK overhead)
            try {
                var sbUrl = 'https://yvptjiowxqllxfzlkosy.supabase.co';
                var sbKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl2cHRqaW93eHFsbHhmemxrb3N5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk0NTQxMTksImV4cCI6MjA4NTAzMDExOX0.9soLQNOJZEpQx__vhJEQzB9SBImPi-ccceB-23WNWAQ';
                var res = await fetch(sbUrl + '/rest/v1/site_content?select=content&id=eq.main', {
                    headers: { 'apikey': sbKey, 'Authorization': 'Bearer ' + sbKey }
                });
                if (res.ok) {
                    var rows = await res.json();
                    if (rows[0] && rows[0].content && rows[0].content.blog && rows[0].content.blog.posts) {
                        posts = rows[0].content.blog.posts.filter(function(p) { return p.published; });
                        // Cache for next visit
                        try {
                            sessionStorage.setItem('girisim_site_cache', JSON.stringify({
                                data: rows[0].content, timestamp: Date.now()
                            }));
                        } catch (e) { /* ignore */ }
                    }
                }
            } catch (e) { console.warn('Blog fetch failed:', e); }

            // Fallback: try getCachedSiteContent (may use Supabase SDK)
            if (posts.length === 0) {
                try {
                    if (typeof getCachedSiteContent === 'function') {
                        var content = await getCachedSiteContent();
                        if (content && content.blog && content.blog.posts && content.blog.posts.length > 0) {
                            posts = content.blog.posts.filter(function(p) { return p.published; });
                        }
                    }
                } catch (e) { /* ignore */ }
            }

            if (posts.length === 0) {
                blogGrid.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;"><i class="fas fa-blog"></i><h3 data-translate="blog.noPosts">Henüz blog yazısı yok</h3><p data-translate="blog.noPostsDesc">Yakında yeni içerikler eklenecek. Takipte kalın!</p></div>';
                if (window._hidePageLoader) window._hidePageLoader();
                return;
            }

            window._blogPosts = posts;
            renderBlogCards(posts);
            if (window._hidePageLoader) window._hidePageLoader();
        }

        function renderBlogCards(posts) {
            var blogGrid = document.getElementById('blogGrid');
            var currentLang = localStorage.getItem('girisim_lang') || 'tr';

            blogGrid.innerHTML = posts.map(function(post, index) {
                var title = getTranslatedField(post, 'title', currentLang);
                var excerpt = getTranslatedField(post, 'excerpt', currentLang);
                var content = getTranslatedField(post, 'content', currentLang);

                return '<div class="blog-card" data-category="' + (post.category || 'Genel') + '">' +
                    '<img loading="lazy" src="' + (post.image || 'images/pexels-factory-machinery.jpg') + '" alt="' + title + '">' +
                    '<div class="card-content">' +
                        '<div class="card-meta">' +
                            '<span><i class="fas fa-calendar"></i> ' + formatDate(post.date) + '</span>' +
                            '<span><i class="fas fa-tag"></i> ' + (post.category || 'Genel') + '</span>' +
                        '</div>' +
                        '<h3>' + title + '</h3>' +
                        '<p>' + (excerpt ? excerpt.replace(/<[^>]*>/g, '') : (content ? content.replace(/<[^>]*>/g, '').substring(0, 150) + '...' : '')) + '</p>' +
                        '<a href="#blog-' + index + '" onclick="openBlogDetail(' + index + '); return false;" class="read-more">' +
                            '<span data-translate="blog.readMore">Devamını Oku</span> <i class="fas fa-arrow-right"></i>' +
                        '</a>' +
                        (post.tags && post.tags.length > 0 ?
                            '<div class="blog-tags">' +
                                post.tags.slice(0, 3).map(function(tag) { return '<span class="blog-tag">' + tag + '</span>'; }).join('') +
                            '</div>'
                        : '') +
                    '</div>' +
                '</div>';
            }).join('');

            // Re-apply category filter if active
            var activeBtn = document.querySelector('#blogCategories button.active');
            if (activeBtn && activeBtn.dataset.category !== 'all') {
                filterByCategory(activeBtn.dataset.category);
            }
        }

        function getTranslatedField(post, field, lang) {
            // Check if there's a translated version
            if (post.translations && post.translations[lang] && post.translations[lang][field]) {
                return post.translations[lang][field];
            }
            // Fallback to default field
            return post[field] || '';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            return date.toLocaleDateString('tr-TR', options);
        }

        function initCategoryFilter() {
            const buttons = document.querySelectorAll('#blogCategories button');
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    buttons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    filterByCategory(this.dataset.category);
                });
            });
        }

        function filterByCategory(category) {
            const cards = document.querySelectorAll('.blog-card');
            cards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function openBlogDetail(index) {
            var posts = window._blogPosts || [];
            var post = posts[index];
            if (!post) return;

            var currentLang = localStorage.getItem('girisim_lang') || 'tr';
            var title = getTranslatedField(post, 'title', currentLang);
            var postContent = getTranslatedField(post, 'content', currentLang);

            document.getElementById('blogDetailImage').src = post.image || 'images/pexels-factory-machinery.jpg';
            document.getElementById('blogDetailTitle').textContent = title;
            document.getElementById('blogDetailDate').textContent = formatDate(post.date);
            document.getElementById('blogDetailCategory').textContent = post.category || 'Genel';
            document.getElementById('blogDetailAuthor').textContent = post.author || 'Admin';
            var isHTML = /<[a-z][\s\S]*>/i.test(postContent);
            document.getElementById('blogDetailContent').innerHTML = isHTML ? postContent : postContent.replace(/\n/g, '<br>');

            document.getElementById('blogDetailModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeBlogDetail() {
            document.getElementById('blogDetailModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close modal on outside click
        document.getElementById('blogDetailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeBlogDetail();
            }
        });

        // Close modal on ESC key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeBlogDetail();

        });
